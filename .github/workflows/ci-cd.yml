name: OPI Agent CI/CD

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate syntax and CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Environment info
        run: |
          python --version
          git --version
          uname -a

      - name: Python syntax check
        run: python3 -m py_compile opi_agent.py

      - name: Bash syntax check
        run: bash -n install_opi.sh

      - name: CLI smoke test
        run: |
          python3 opi_agent.py --help
          python3 opi_agent.py version
          python3 opi_agent.py paths check
          python3 opi_agent.py config show || true
          python3 opi_agent.py update status || true

      - name: Check unresolved placeholders
        # The tokens below appear by design in:
        #   - opi-agent.service.template  (substituted by install_opi.sh)
        #   - install_opi.sh              (sed patterns that do the substitution)
        #   - ci-cd.yml                   (this very check, plus its explanatory comment)
        # so all three files are excluded from this scan.
        run: |
          if grep -RniE 'TODO|FIXME|REPLACE_ME|CHANGE_ME|__BASE_DIR__|__VENV_PYTHON__|__SERVICE_USER__' . \
            --exclude-dir=.git \
            --exclude-dir=.venv \
            --exclude-dir=__pycache__ \
            --exclude='*.pyc' \
            --exclude='opi-agent.service.template' \
            --exclude='install_opi.sh' \
            --exclude='ci-cd.yml'; then
            echo "Unresolved placeholders found"
            exit 1
          fi

      - name: Git diff check
        run: git diff --check

  sandbox:
    name: Sandbox install and smoke test
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create sandbox copy
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/opi-sandbox"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          rsync -a --delete \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            "$GITHUB_WORKSPACE"/ \
            "$WORK"/

      - name: Install in sandbox without service
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/opi-sandbox"
          chmod +x install_opi.sh
          ./install_opi.sh --skip-service

      - name: Sandbox CLI tests
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/opi-sandbox"

          . .venv/bin/activate

          python opi_agent.py --help
          python opi_agent.py version
          python opi_agent.py paths check
          python opi_agent.py config show || true

          export ALLOW_EXEC=1
          export EXEC_CONFIRM_REQUIRED=1
          python opi_agent.py exec --confirm -- echo hello

  release:
    name: Build release artifact
    runs-on: ubuntu-latest
    needs: [validate, sandbox]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build archive
        run: |
          set -euo pipefail
          mkdir -p dist
          tar \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='workspace' \
            --exclude='logs' \
            --exclude='run' \
            --exclude='dist' \
            -czf "dist/opi-agent-${GITHUB_REF_NAME}.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opi-agent-${{ github.ref_name }}
          path: dist/opi-agent-${{ github.ref_name }}.tar.gz
