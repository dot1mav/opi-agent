name: OPI Agent CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate syntax and CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show environment
        run: |
          python --version
          git --version
          uname -a

      - name: Python syntax check
        run: python3 -m py_compile opi_agent.py

      - name: Bash syntax check
        run: bash -n install_opi.sh

      - name: Make installer executable
        run: chmod +x install_opi.sh

      - name: CLI help smoke test
        run: |
          python3 opi_agent.py --help
          python3 opi_agent.py daemon --help
          python3 opi_agent.py telegram --help
          python3 opi_agent.py exec --help
          python3 opi_agent.py chat --help
          python3 opi_agent.py install --help
          python3 opi_agent.py uninstall --help

      - name: Check for unresolved placeholders
        run: |
          if grep -RniE 'TODO|FIXME|REPLACE_ME|CHANGE_ME' . \
            --exclude-dir=.git \
            --exclude-dir=.venv \
            --exclude-dir=__pycache__ \
            --exclude='*.pyc'; then
            echo "Unresolved placeholders found"
            exit 1
          fi

      - name: Check git diff cleanliness
        run: git diff --check

  sandbox:
    name: Isolated sandbox smoke test
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create isolated sandbox copy
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/opi-sandbox"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          rsync -a --delete \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            "$GITHUB_WORKSPACE"/ \
            "$_WORKSPACE"/ \
            "$WORK"/

             run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/opi-sandbox"

          python3 -m py_compile opi_agent.py
          bash -n install_opi.sh

          python3 opi_agent.py --help
          python3 opi_agent.py exec --help
          python3 opi_agent.py chat --help
