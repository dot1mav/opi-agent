name: OPI Agent CI/CD

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate syntax and CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Environment info
        run: |
          python --version
          git --version
          uname -a

      - name: Python syntax check
        run: python -m py_compile opi_agent.py

      - name: Bash syntax check
        run: bash -n install_opi.sh

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: MyPy type check
        run: mypy opi_agent

      - name: Bandit security scan
        run: bandit -r opi_agent -f json -o bandit-report.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Pip-audit dependency scan
        run: pip-audit --format=json --output=pip-audit-report.json || true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json

      - name: CLI smoke test
        run: |
          python opi_agent.py --help
          python opi_agent.py version
          python opi_agent.py paths check
          python opi_agent.py config show || true
          python opi_agent.py update status || true

      - name: Check unresolved placeholders
        run: |
          if grep -RniE 'TODO|FIXME|REPLACE_ME|CHANGE_ME|__BASE_DIR__|__VENV_PYTHON__|__SERVICE_USER__' . \
            --exclude-dir=.git \
            --exclude-dir=.venv \
            --exclude-dir=__pycache__ \
            --exclude-dir=tests \
            --exclude='*.pyc' \
            --exclude='opi-agent.service.template' \
            --exclude='install_opi.sh' \
            --exclude='ci-cd.yml'; then
            echo "Unresolved placeholders found"
            exit 1
          fi

      - name: Git diff check
        run: git diff --check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=opi_agent --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  sandbox:
    name: Sandbox install and smoke test
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create sandbox copy
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/opi-sandbox"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          rsync -a --delete \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            "$GITHUB_WORKSPACE"/ \
            "$WORK"/

      - name: Install in sandbox without service
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/opi-sandbox"
          chmod +x install_opi.sh
          ./install_opi.sh --skip-service

      - name: Sandbox CLI tests
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/opi-sandbox"

          . .venv/bin/activate

          python opi_agent.py --help
          python opi_agent.py version
          python opi_agent.py paths check
          python opi_agent.py config show || true

          export OPI_SHELL_ENABLED=1
          export EXEC_CONFIRM_REQUIRED=1
          python opi_agent.py exec --confirm -- echo hello

          # Test patch commands
          python opi_agent.py patch list
          python opi_agent.py patch set-url https://example.com/patches
          python opi_agent.py patch set-path /tmp/patches

  release:
    name: Build release artifact
    runs-on: ubuntu-latest
    needs: [validate, test, sandbox]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build archive
        run: |
          set -euo pipefail
          mkdir -p dist
          tar \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='workspace' \
            --exclude='logs' \
            --exclude='run' \
            --exclude='dist' \
            --exclude='tests' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            -czf "dist/opi-agent-${GITHUB_REF_NAME}.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opi-agent-${{ github.ref_name }}
          path: dist/opi-agent-${{ github.ref_name }}.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/opi-agent-${{ github.ref_name }}.tar.gz
          generate_release_notes: true